<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Knack for Games: 6wordle</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/swordle.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"utils/": "./js/utils/",
		"components/": "./js/components/",
		"swordle/": "./js/modules/swordle/"
	}
}
</script>
</head>
<body>

<a href="/" class="back">&laquo; Back</a>

<main>
	<h1>6wordle</h1>

	<div data-q-component="swordle">
		<div id="swordle-board" class="board"></div>
		<div class="keyboard">
			<div>
				<span id="keyboard-q" data-q-click="type">q</span>
				<span id="keyboard-w" data-q-click="type">w</span>
				<span id="keyboard-e" data-q-click="type">e</span>
				<span id="keyboard-r" data-q-click="type">r</span>
				<span id="keyboard-t" data-q-click="type">t</span>
				<span id="keyboard-y" data-q-click="type">y</span>
				<span id="keyboard-u" data-q-click="type">u</span>
				<span id="keyboard-i" data-q-click="type">i</span>
				<span id="keyboard-o" data-q-click="type">o</span>
				<span id="keyboard-p" data-q-click="type">p</span>
			</div>
			<div>
				<span id="keyboard-a" data-q-click="type">a</span>
				<span id="keyboard-s" data-q-click="type">s</span>
				<span id="keyboard-d" data-q-click="type">d</span>
				<span id="keyboard-f" data-q-click="type">f</span>
				<span id="keyboard-g" data-q-click="type">g</span>
				<span id="keyboard-h" data-q-click="type">h</span>
				<span id="keyboard-j" data-q-click="type">j</span>
				<span id="keyboard-k" data-q-click="type">k</span>
				<span id="keyboard-l" data-q-click="type">l</span>
			</div>
			<div>
				<span data-q-click="type" class="enter">Enter</span>
				<span id="keyboard-z" data-q-click="type">z</span>
				<span id="keyboard-x" data-q-click="type">x</span>
				<span id="keyboard-c" data-q-click="type">c</span>
				<span id="keyboard-v" data-q-click="type">v</span>
				<span id="keyboard-b" data-q-click="type">b</span>
				<span id="keyboard-n" data-q-click="type">n</span>
				<span id="keyboard-m" data-q-click="type">m</span>
				<span data-q-click="type" class="delete"><svg fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M14.6 2.5H4.49a1.25 1.25 0 0 0-1 .51L.39 7.26a1.26 1.26 0 0 0 0 1.48L3.48 13a1.26 1.26 0 0 0 1 .51H14.6a1.25 1.25 0 0 0 1.25-1.25V3.75A1.25 1.25 0 0 0 14.6 2.5zm0 9.75H4.49L1.4 8l3.09-4.25H14.6z"/><path d="m7.86 10.55 1.99-1.72 1.99 1.72.82-.94L10.81 8l1.85-1.61-.82-.94-1.99 1.72-1.99-1.72-.82.94L8.9 8 7.04 9.61l.82.94z"/></svg></span>
			</div>
		</div>
	</div>
</main>

<div id="overlay" class="overlay hidden animating">
	<div>
		<h1>Success!</h1>
		<img src="/media/trophy.svg" alt="" />
		<p>Today’s word was <strong id="word-success"></strong> which you guessed in <span id="guesses"></span> guesses!</p>
		<a href="/" class="btn">Return</a>
	</div>
</div>

<div id="fail" class="overlay hidden">
	<div>
		<h1>Oh no!</h1>
		<img src="/media/shock.svg" alt="" />
		<p>Today’s word was <strong id="word-fail"></strong></p>
		<a href="/" class="btn">Return</a>
	</div>
</div>

<canvas id="victory" class="hidden"></canvas>

<script type="module">

import { directives } from 'q/reactive/directives.js'
import { formatTime } from 'utils/number.js'
import { game, States } from 'components/state.js'
import { Victory } from 'components/victory.js'
import { Save } from 'components/save.js'
import Swordle from 'swordle/component.js'
import { STORAGE_KEY } from 'swordle/types.js'

game.on(States.GAMEOVER, () => {
	document.getElementById('overlay').classList.remove('hidden')
	document.getElementById('victory').classList.remove('hidden')

	const victory = new Victory('victory')

	victory.init(
		victory.width / 2,
		victory.height * 0.55,
		Math.floor((Math.random() * 50) + 150)
	)

	victory.start()
})

// store the completion time in local storage
game.on(States.SCORE, (score) => {
	const save = new Save(STORAGE_KEY)
	const result = save.save(score)

	document.getElementById('word-success').innerText = result.word
	document.getElementById('guesses').innerText = result.guesses
})

game.on(States.FAIL, (score) => {
	const save = new Save(STORAGE_KEY)
	const result = save.save(score)

	document.getElementById('word-fail').innerText = result.word
	document.getElementById('fail').classList.remove('hidden')
})

directives.registerComponent('swordle', Swordle)
directives.load(document.body)

</script>

</body>
</html>

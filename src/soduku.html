<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Knack for Games: Soduku</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/soduku.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"utils/": "./js/utils/",
		"components/": "./js/components/",
		"soduku/": "./js/modules/soduku/"
	}
}
</script>
</head>
<body>

<a href="/" class="back">&laquo; Back</a>

<main>
	<h1>Soduku</h1>

	<div data-q-component="timer" class="timer">
		<span data-q-text="formattedTime"></span>
	</div>

	<div data-q-component="soduku">
		<div class="difficulty" data-q-text="difficulty"></div>
		<div id="soduku-board" class="board grid-9"></div>
		<div class="keyboard">
			<div data-q-class="keyboardClass">
				<span id="keyboard-1" data-q-disabled="complete1" data-q-click="type">1</span>
				<span id="keyboard-2" data-q-disabled="complete2" data-q-click="type">2</span>
				<span id="keyboard-3" data-q-disabled="complete3" data-q-click="type">3</span>
				<span id="keyboard-4" data-q-disabled="complete4" data-q-click="type">4</span>
				<span id="keyboard-5" data-q-disabled="complete5" data-q-click="type">5</span>
				<span id="keyboard-6" data-q-disabled="complete6" data-q-click="type">6</span>
				<span id="keyboard-7" data-q-disabled="complete7" data-q-click="type">7</span>
				<span id="keyboard-8" data-q-disabled="complete8" data-q-click="type">8</span>
				<span id="keyboard-9" data-q-disabled="complete9" data-q-click="type">9</span>
				<span data-q-click="toggleNotes">
					<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
<path d="M11.4001 18.1612L11.4001 18.1612L18.796 10.7653C17.7894 10.3464 16.5972 9.6582 15.4697 8.53068C14.342 7.40298 13.6537 6.21058 13.2348 5.2039L5.83882 12.5999L5.83879 12.5999C5.26166 13.1771 4.97307 13.4657 4.7249 13.7838C4.43213 14.1592 4.18114 14.5653 3.97634 14.995C3.80273 15.3593 3.67368 15.7465 3.41556 16.5208L2.05445 20.6042C1.92743 20.9852 2.0266 21.4053 2.31063 21.6894C2.59466 21.9734 3.01478 22.0726 3.39584 21.9456L7.47918 20.5844C8.25351 20.3263 8.6407 20.1973 9.00498 20.0237C9.43469 19.8189 9.84082 19.5679 10.2162 19.2751C10.5343 19.0269 10.823 18.7383 11.4001 18.1612Z" />
<path d="M20.8482 8.71306C22.3839 7.17735 22.3839 4.68748 20.8482 3.15178C19.3125 1.61607 16.8226 1.61607 15.2869 3.15178L14.3999 4.03882C14.4121 4.0755 14.4246 4.11268 14.4377 4.15035C14.7628 5.0875 15.3763 6.31601 16.5303 7.47002C17.6843 8.62403 18.9128 9.23749 19.85 9.56262C19.8875 9.57563 19.9245 9.58817 19.961 9.60026L20.8482 8.71306Z" />
</svg>
				</span>
			</div>
			<div></div>
		</div>
		<div class="buttons">
			<button data-q-click="reset">Restart</button>
			<button data-q-click="undo" data-q-disabled="!canUndo">Undo</button>
		</div>
	</div>
</main>

<div id="overlay" class="overlay hidden animating" data-q-component="success">
	<div>
		<h1>Success!</h1>
		<img src="/media/trophy.svg" alt="" />
		<p>You completed today’s game in <time data-q-text="time"></time>!</p>
		<a href="/" class="btn">Return</a>
	</div>
</div>

<canvas id="victory" class="hidden"></canvas>

<div class="version">$VERSION</div>

<div id="toast" class="toast"></div>

<script type="module" src="./js/modules/soduku/main.js"></script>

<template id="cell">
	<span class="tile">
		<span class="value"></span>
		<span class="notes">
			<span data-n="1"></span>
			<span data-n="2"></span>
			<span data-n="3"></span>
			<span data-n="4"></span>
			<span data-n="5"></span>
			<span data-n="6"></span>
			<span data-n="7"></span>
			<span data-n="8"></span>
			<span data-n="9"></span>
		</span>
	</span>
</template>

</body>
</html>

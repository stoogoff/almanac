<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Knack for Games: Soduku</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/soduku.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"utils/": "./js/utils/",
		"components/": "./js/components/",
		"soduku/": "./js/modules/soduku/"
	}
}
</script>
</head>
<body>

<a href="/" class="back">&laquo; Back</a>

<main>
	<h1>Soduku</h1>

	<div data-q-component="timer" class="timer">
		<span data-q-text="formattedTime"></span>
	</div>

	<div data-q-component="soduku">
		<div id="soduku-board" class="board grid-9"></div>
		<div class="keyboard">
			<div></div>
			<div data-q-class="keyboardClass">
				<span id="keyboard-1" data-q-click="type">1</span>
				<span id="keyboard-2" data-q-click="type">2</span>
				<span id="keyboard-3" data-q-click="type">3</span>
				<span id="keyboard-4" data-q-click="type">4</span>
				<span id="keyboard-5" data-q-click="type">5</span>
				<span id="keyboard-6" data-q-click="type">6</span>
				<span id="keyboard-7" data-q-click="type">7</span>
				<span id="keyboard-8" data-q-click="type">8</span>
				<span id="keyboard-9" data-q-click="type">9</span>
			</div>
		</div>
		<div class="buttons">
			<button data-q-click="reset">Restart</button>
			<button data-q-click="undo" data-q-disabled="!canUndo">Undo</button>
			<button data-q-click="toggleNotes">Notes</button>
		</div>
	</div>
</main>

<div id="overlay" class="overlay hidden animating" data-q-component="success">
	<div>
		<h1>Success!</h1>
		<img src="/media/trophy.svg" alt="" />
		<p>You completed today’s game in <time data-q-text="time"></time>!</p>
		<a href="/" class="btn">Return</a>
	</div>
</div>

<canvas id="victory" class="hidden"></canvas>

<div class="version">$VERSION</div>

<div id="toast" class="toast"></div>

<script type="module" src="./js/modules/soduku/main.js"></script>

<template id="cell">
	<span class="tile">
		<span class="value"></span>
		<span class="notes">
			<span data-n="1"></span>
			<span data-n="2"></span>
			<span data-n="3"></span>
			<span data-n="4"></span>
			<span data-n="5"></span>
			<span data-n="6"></span>
			<span data-n="7"></span>
			<span data-n="8"></span>
			<span data-n="9"></span>
		</span>
	</span>
</template>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Knack for Games: Queens</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/queens.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"utils/": "./js/utils/",
		"components/": "./js/components/",
		"queens/": "./js/modules/queens/"
	}
}
</script>
</head>
<body>

<a href="/" class="back">&laquo; Back</a>

<main>
	<h1>Queens</h1>

	<div data-q-component="timer" class="timer">
		<span data-q-text="formattedTime"></span>
	</div>

	<div data-q-component="queens">
		<div id="queens-board" class="board"></div>
		<div class="buttons">
			<button data-q-click="reset">Restart</button>
			<button data-q-click="undo" data-q-disabled="!canUndo">Undo</button>
		</div>
	</div>
</main>

<div id="overlay" class="overlay hidden animating">
	<div>
		<h1>Success!</h1>
		<img src="/media/trophy.svg" alt="" />
		<p>You completed today’s game in <time id="time"></time>!</p>
		<a href="/" class="btn">Return</a>
	</div>
</div>

<canvas id="victory" class="hidden"></canvas>

<script type="module">

import { directives } from 'q/reactive/directives.js'
import { formatTime } from 'utils/number.js'
import { getGame, GameStates } from 'components/game.js'
import { Victory } from 'components/victory.js'
import Timer from 'components/timer.js'
import Queens from 'queens/component.js'
import { STORAGE_KEY } from 'queens/types.js'

const game = getGame(STORAGE_KEY)

game.on(GameStates.GAMEOVER, () => {
	window.setTimeout(() => {
		console.log(game.state)
		document.getElementById('time').innerText = formatTime(game.state?.score.time)
	})
	document.getElementById('overlay').classList.remove('hidden')
	document.getElementById('victory').classList.remove('hidden')

	const victory = new Victory('victory')

	victory.init(
		victory.width / 2,
		victory.height * 0.55,
		Math.floor((Math.random() * 50) + 150)
	)

	victory.start()
})

directives.registerComponent('timer', Timer)
directives.registerComponent('queens', Queens)
directives.load(document.body, {
	data: {
		key: STORAGE_KEY,
	}
})

</script>

</body>
</html>

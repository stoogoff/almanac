<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Knack for Games</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/mambo.css" />
<link rel="stylesheet" href="css/queens.css" />
<link rel="stylesheet" href="css/swordle.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"migrations/": "./js/migrations/",
		"utils/": "./js/utils/",
		"components/": "./js/components/",
		"menu/": "./js/modules/menu/",
		"mambo/": "./js/modules/mambo/",
		"queens/": "./js/modules/queens/",
		"soduku/": "./js/modules/soduku/",
		"swordle/": "./js/modules/swordle/"
	}
}
</script>
<link rel="modulepreload" href="./js/components/game.js" />
<link rel="modulepreload" href="./js/migrations/01-convert-time-to-score.js" />
<link rel="modulepreload" href="./js/migrations/index.js" />
<link rel="modulepreload" href="./js/modules/mambo/types.js" />
<link rel="modulepreload" href="./js/modules/menu/component.js" />
<link rel="modulepreload" href="./js/modules/menu/main.js" />
<link rel="modulepreload" href="./js/modules/queens/types.js" />
<link rel="modulepreload" href="./js/modules/swordle/types.js" />
<link rel="modulepreload" href="./js/utils/lib.js" />
<link rel="modulepreload" href="./js/utils/number.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/reactive/directives.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/assert.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/emitter.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/list.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/storage.js" />
</head>
<body>

<main data-q-component="menu">
	<h1>Knack</h1>
	<h2>A Knack for Games</h2>

	<menu>
		<li data-q-each="games">
			<a data-q-href="url">
				<div>
					<div>
						<h3 data-q-text="title"></h3>
						<p data-q-text="strapline"></p>
					</div>
					<img data-q-src="icon" data-q-if="icon" />
				</div>
				<dl data-q-if="showStats">
					<dt>Best:</dt>
					<dd data-q-text="best"></dd>
					<dt>Last:</dt>
					<dd data-q-text="last"></dd>
				</dl>
			</a>
		</li>
	</menu>
	<div class="share">
		<button data-q-click="share" data-q-disabled="!canShare">
			Share
		</button>
	</div>
</main>

<div class="version">$VERSION</div>

<div id="toast" class="toast"></div>

<script type="module" src="./js/modules/menu/main.js"></script>

</body>
</html>

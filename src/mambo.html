<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Knack for Games: Mambo</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/mambo.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"utils/": "./js/utils/",
		"components/": "./js/components/",
		"mambo/": "./js/modules/mambo/"
	}
}
</script>
<link rel="modulepreload" href="./js/components/game.js" />
<link rel="modulepreload" href="./js/components/grid.js" />
<link rel="modulepreload" href="./js/components/timer.js" />
<link rel="modulepreload" href="./js/components/victory.js" />
<link rel="modulepreload" href="./js/modules/mambo/component.js" />
<link rel="modulepreload" href="./js/modules/mambo/main.js" />
<link rel="modulepreload" href="./js/modules/mambo/mambo.js" />
<link rel="modulepreload" href="./js/modules/mambo/success.js" />
<link rel="modulepreload" href="./js/modules/mambo/types.js" />
<link rel="modulepreload" href="./js/utils/number.js" />
<link rel="modulepreload" href="./js/utils/seed.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/reactive/directives.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/assert.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/emitter.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/list.js" />
<link rel="modulepreload" href="https://cdn.we-evolve.co.uk/js/q/v1.1.1/utils/storage.js" />
</head>
<body>

<a href="/" class="back">&laquo; Back</a>

<main>
	<h1>’Bo</h1>

	<div data-q-component="timer" class="timer">
		<span data-q-text="formattedTime"></span>
	</div>

	<div data-q-component="mambo">
		<div id="mambo-board" class="board"></div>
		<div class="buttons">
			<button data-q-click="reset">Restart</button>
			<button data-q-click="undo" data-q-disabled="!canUndo">Undo</button>
		</div>
	</div>
</main>

<div id="overlay" class="overlay hidden animating" data-q-component="success">
	<div>
		<h1>Success!</h1>
		<img src="/media/trophy.svg" alt="" />
		<p>You completed today’s game in <time data-q-text="time"></time>!</p>
		<a href="/" class="btn">Return</a>
	</div>
</div>

<canvas id="victory" class="hidden"></canvas>

<div class="version">$VERSION</div>

<script type="module" src="./js/modules/mambo/main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Knack for Games: Mambo</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/mambo.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"utils/": "./js/utils/",
		"components/": "./js/components/",
		"mambo/": "./js/modules/mambo/"
	}
}
</script>
</head>
<body>

<a href="/" class="back">&laquo; Back</a>

<main>
	<h1>’Bo</h1>

	<div data-q-component="timer" class="timer">
		<span data-q-text="formattedTime"></span>
	</div>

	<div data-q-component="mambo">
		<div id="mambo-board"></div>
		<div class="buttons">
			<button data-q-click="reset">Restart</button>
			<button data-q-click="undo" data-q-disabled="!canUndo">Undo</button>
		</div>
	</div>
</main>

<div id="overlay" class="overlay animating">
	<div>
		<h1>Success!</h1>
		<img src="/media/trophy.svg" alt="" />
		<p>You completed today’s game in <time id="time"></time>!</p>
		<a href="/" class="btn">Return</a>
	</div>
</div>

<canvas id="victory" class=""></canvas>

<script type="module">

import { directives } from 'q/reactive/directives.js'
import { formatTime } from 'utils/number.js'
import { game, States } from 'components/state.js'
import { Victory } from 'components/victory.js'
import Timer from 'components/timer.js'
import Mambo from 'mambo/component.js'
import { save } from 'mambo/save.js'

game.on(States.GAMEOVER, () => {
	document.getElementById('overlay').classList.remove('hidden')
	document.getElementById('victory').classList.remove('hidden')

	const victory = new Victory('victory')

	victory.create(victory.width / 2, victory.height * 0.55, Math.floor((Math.random() * 50) + 150))

	let tick = 50
	let times = 3

	const animation = () => {
		victory.animate()

		if(--tick < 0 && times >= 0) {
			victory.create(victory.width / 2, victory.height * 0.55, Math.floor((Math.random() * 50) + 150))
			tick = 50

			--times
		}

		requestAnimationFrame(animation)
	}

	animation()
})

// store the completion time in local storage
game.on(States.TIME, (time) => {
	const result = save(time)

	document.getElementById('time').innerText = formatTime(result)
})
game.on(States.PAUSE, (time) => console.log('pause'))

directives.registerComponent('timer', Timer)
directives.registerComponent('mambo', Mambo)
directives.load(document.body)

</script>

</body>
</html>
